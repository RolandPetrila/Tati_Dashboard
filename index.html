<!doctype html>
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>Protected Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- do not cache this page -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
      .staticrypt-hr {
        margin-top: 20px;
        margin-bottom: 20px;
        border: 0;
        border-top: 1px solid #eee;
      }

      .staticrypt-page {
        width: 360px;
        padding: 8% 0 0;
        margin: auto;
        box-sizing: border-box;
      }

      .staticrypt-form {
        position: relative;
        z-index: 1;
        background: #ffffff;
        max-width: 360px;
        margin: 0 auto 100px;
        padding: 45px;
        text-align: center;
        box-shadow:
          0 0 20px 0 rgba(0, 0, 0, 0.2),
          0 5px 5px 0 rgba(0, 0, 0, 0.24);
      }

      .staticrypt-form input[type="password"],
      input[type="text"] {
        background: inherit;
        border: 0;
        box-sizing: border-box; /* This ensures padding is included in the total width */
        font-size: 14px;
        outline: 0;
        padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
        width: 100%;
      }

      .staticrypt-password-container {
        position: relative;
        outline: 0;
        background: #f2f2f2;
        width: 100%;
        border: 0;
        margin: 0 0 15px;
        box-sizing: border-box;
      }

      .staticrypt-toggle-password-visibility {
        cursor: pointer;
        height: 20px;
        opacity: 60%;
        padding: 13px;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
      }

      .staticrypt-form .staticrypt-decrypt-button {
        text-transform: uppercase;
        outline: 0;
        background: #4CAF50;
        width: 100%;
        border: 0;
        padding: 15px;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }

      .staticrypt-form .staticrypt-decrypt-button:hover,
      .staticrypt-form .staticrypt-decrypt-button:active,
      .staticrypt-form .staticrypt-decrypt-button:focus {
        background: #4CAF50;
        filter: brightness(92%);
      }

      .staticrypt-html {
        height: 100%;
      }

      .staticrypt-body {
        height: 100%;
        margin: 0;
      }

      .staticrypt-content {
        height: 100%;
        margin-bottom: 1em;
        background: #76B852;
        font-family: "Arial", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .staticrypt-instructions {
        margin-top: -1em;
        margin-bottom: 1em;
      }

      .staticrypt-title {
        font-size: 1.5em;
      }

      label.staticrypt-remember {
        display: flex;
        align-items: center;
        margin-bottom: 1em;
      }

      .staticrypt-remember input[type="checkbox"] {
        transform: scale(1.5);
        margin-right: 1em;
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .staticrypt-spinner {
        display: inline-block;
        width: 2rem;
        height: 2rem;
        vertical-align: text-bottom;
        border: 0.25em solid gray;
        border-right-color: transparent;
        border-radius: 50%;
        -webkit-animation: spinner-border 0.75s linear infinite;
        animation: spinner-border 0.75s linear infinite;
        animation-duration: 0.75s;
        animation-timing-function: linear;
        animation-delay: 0s;
        animation-iteration-count: infinite;
        animation-direction: normal;
        animation-fill-mode: none;
        animation-play-state: running;
        animation-name: spinner-border;
      }

      @keyframes spinner-border {
        100% {
          transform: rotate(360deg);
        }
      }

      @media screen and (-webkit-min-device-pixel-ratio: 0) {
        .staticrypt-form input[type="password"],
        input[type="text"] {
          font-size: 16px;
        }
      }
    </style>
  </head>

          var newHtmlAttrs = doc.documentElement.attributes;
          for (var i = 0; i < newHtmlAttrs.length; i++) {
            document.documentElement.setAttribute(
              newHtmlAttrs[i].name,
              newHtmlAttrs[i].value,
            );
          }
          while (document.body.attributes.length) {
            document.body.removeAttribute(document.body.attributes[0].name);
          }
          var newBodyAttrs = doc.body.attributes;
          for (var j = 0; j < newBodyAttrs.length; j++) {
            document.body.setAttribute(
              newBodyAttrs[j].name,
              newBodyAttrs[j].value,
            );
          }

          // 3. Inlocuieste body content
          document.body.innerHTML = doc.body.innerHTML;

          // 4. Re-creeaza <script> tags pentru a forta executia
          //    (innerHTML insereaza scripts ca text inert)
          function cloneScript(oldScript) {
            var newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(function (attr) {
              newScript.setAttribute(attr.name, attr.value);
            });
            newScript.text = oldScript.text || oldScript.textContent || "";
            return newScript;
          }

          // 4a. scripts din <head>-ul original: append la <head>
          doc.head.querySelectorAll("script").forEach(function (oldScript) {
            document.head.appendChild(cloneScript(oldScript));
          });

          // 4b. scripts din <body>: replace fiecare scriptInert cu unul nou activ
          document.body
            .querySelectorAll("script")
            .forEach(function (oldScript) {
              var newScript = cloneScript(oldScript);
              oldScript.parentNode.replaceChild(newScript, oldScript);
            });

          // 5. Trigger DOMContentLoaded + load (multe scripts asculta pe ele)
          setTimeout(function () {
            try {
              window.dispatchEvent(new Event("DOMContentLoaded"));
              window.dispatchEvent(new Event("load"));
            } catch (e) {}
          }, 0);
        },
        clearLocalStorageCallback: null,
      };
